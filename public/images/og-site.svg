<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="50%" style="stop-color:#312e81"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative game icons -->
  <circle cx="150" cy="150" r="40" fill="#7c3aed" opacity="0.3"/>
  <circle cx="1050" cy="150" r="40" fill="#f59e0b" opacity="0.3"/>
  <circle cx="200" cy="480" r="50" fill="#10b981" opacity="0.3"/>
  <circle cx="1000" cy="480" r="50" fill="#ef4444" opacity="0.3"/>
  <!-- Main content -->
  <text x="600" y="250" text-anchor="middle" font-size="72" font-family="Arial,sans-serif" fill="#fbbf24" font-weight="bold">PlayFreeGames</text>
  <text x="600" y="330" text-anchor="middle" font-size="36" font-family="Arial,sans-serif" fill="#e2e8f0">Free Online Games. No Downloads, Just Play!</text>
  <!-- Game controller icon -->
  <text x="600" y="430" text-anchor="middle" font-size="60">🎮</text>
  <!-- Bottom bar -->
  <rect x="300" y="500" width="600" height="4" rx="2" fill="#7c3aed" opacity="0.5"/>
  <text x="600" y="560" text-anchor="middle" font-size="24" font-family="Arial,sans-serif" fill="#94a3b8">game.dungeonpath.com</text>
</svg>
