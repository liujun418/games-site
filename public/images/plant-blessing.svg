<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a2a"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4813a"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%">
      <stop offset="0%" stop-color="rgba(74,222,128,0.3)"/>
      <stop offset="100%" stop-color="rgba(74,222,128,0)"/>
    </radialGradient>
  </defs>
  <rect width="400" height="225" fill="url(#sky)"/>
  <ellipse cx="200" cy="160" rx="180" ry="60" fill="url(#glow)"/>
  <!-- Pot -->
  <ellipse cx="200" cy="185" rx="45" ry="12" fill="#654321"/>
  <rect x="160" y="155" width="80" height="30" rx="5" fill="url(#pot)"/>
  <ellipse cx="200" cy="155" rx="40" ry="8" fill="#a0785a"/>
  <!-- Stem -->
  <rect x="196" y="80" width="8" height="75" rx="4" fill="#22c55e"/>
  <!-- Leaves -->
  <ellipse cx="175" cy="130" rx="18" ry="8" fill="#4ade80" transform="rotate(-30 175 130)"/>
  <ellipse cx="225" cy="115" rx="18" ry="8" fill="#4ade80" transform="rotate(25 225 115)"/>
  <ellipse cx="180" cy="100" rx="15" ry="7" fill="#27ae60" transform="rotate(-20 180 100)"/>
  <ellipse cx="220" cy="90" rx="15" ry="7" fill="#27ae60" transform="rotate(15 220 90)"/>
  <!-- Flower -->
  <circle cx="200" cy="72" r="14" fill="#fd79a8" opacity="0.9"/>
  <circle cx="190" cy="65" r="10" fill="#ff9ecb" opacity="0.8"/>
  <circle cx="210" cy="65" r="10" fill="#ff9ecb" opacity="0.8"/>
  <circle cx="188" cy="78" r="10" fill="#ff9ecb" opacity="0.8"/>
  <circle cx="212" cy="78" r="10" fill="#ff9ecb" opacity="0.8"/>
  <circle cx="200" cy="72" r="6" fill="#fbbf24"/>
  <!-- Fruits -->
  <circle cx="172" cy="140" r="6" fill="#e74c3c" opacity="0.9"/>
  <circle cx="228" cy="128" r="6" fill="#f39c12" opacity="0.9"/>
  <!-- Soil -->
  <ellipse cx="200" cy="155" rx="35" ry="6" fill="#5a3a1a"/>
  <!-- Small particles -->
  <circle cx="155" cy="100" r="2" fill="#4ade80" opacity="0.5"/>
  <circle cx="245" cy="85" r="2" fill="#fbbf24" opacity="0.5"/>
  <circle cx="180" cy="55" r="1.5" fill="#fd79a8" opacity="0.4"/>
  <circle cx="220" cy="50" r="1.5" fill="#4ade80" opacity="0.4"/>
</svg>