<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect Four - Play Free Online</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0f172a,#1e1b4b);font-family:Arial,sans-serif;color:#e2e8f0}.wrap{width:min(94vw,680px);text-align:center}.bar{display:flex;justify-content:center;gap:12px;align-items:center;margin:12px 0}.status{background:#111827;border:1px solid #334155;padding:10px 14px;border-radius:9px;font-weight:800}button{border:0;border-radius:9px;background:#facc15;color:#422006;padding:10px 14px;font-weight:900;cursor:pointer}.board{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;background:#2563eb;border-radius:18px;padding:14px;box-shadow:0 20px 40px #0006}.slot{aspect-ratio:1;border-radius:50%;background:#0f172a;border:4px solid #1d4ed8;cursor:pointer}.red{background:#ef4444}.yellow{background:#facc15}.win{outline:5px solid #22c55e}
</style>
</head>
<body>
<main class="wrap">
  <h1>Connect Four</h1>
  <div class="bar"><div class="status" id="status">Red starts</div><button id="reset">Reset</button></div>
  <div class="board" id="board"></div>
</main>
<script>
const rows=6,cols=7,boardEl=document.getElementById('board'),statusEl=document.getElementById('status');let grid,turn,done,winSet=[];
function start(){grid=Array.from({length:rows},()=>Array(cols).fill(''));turn='red';done=false;winSet=[];draw();statusEl.textContent='Red turn';}
function draw(){boardEl.innerHTML='';for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const d=document.createElement('div');d.className='slot '+grid[r][c]+(winSet.some(p=>p[0]===r&&p[1]===c)?' win':'');d.onclick=()=>drop(c);boardEl.appendChild(d);}}
function drop(c){if(done)return;for(let r=rows-1;r>=0;r--)if(!grid[r][c]){grid[r][c]=turn;const w=check(r,c);if(w){done=true;winSet=w;statusEl.textContent=(turn==='red'?'Red':'Yellow')+' wins!';}else if(grid.every(row=>row.every(Boolean))){done=true;statusEl.textContent='Draw';}else{turn=turn==='red'?'yellow':'red';statusEl.textContent=(turn==='red'?'Red':'Yellow')+' turn';}draw();return;}}
function check(r,c){const dirs=[[1,0],[0,1],[1,1],[1,-1]];for(const [dr,dc] of dirs){let line=[[r,c]];for(const s of[-1,1]){let nr=r+dr*s,nc=c+dc*s;while(nr>=0&&nr<rows&&nc>=0&&nc<cols&&grid[nr][nc]===turn){line.push([nr,nc]);nr+=dr*s;nc+=dc*s;}}if(line.length>=4)return line;}return null;}
document.getElementById('reset').onclick=start;start();
</script>
</body>
</html>
