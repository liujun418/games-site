<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reaction Dash - Play Free Online</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at top,#164e63,#020617 65%);font-family:Arial,sans-serif;color:#e2e8f0}.wrap{text-align:center;width:min(92vw,580px)}.arena{height:320px;border:1px solid #155e75;border-radius:22px;background:#07111f;position:relative;overflow:hidden;box-shadow:0 20px 50px #0008}.target{position:absolute;width:58px;height:58px;border-radius:50%;background:#22c55e;border:6px solid #bbf7d0;box-shadow:0 0 28px #22c55e;transform:translate(-50%,-50%);cursor:pointer}.bad{background:#ef4444;border-color:#fecaca;box-shadow:0 0 28px #ef4444}.hud{display:flex;justify-content:center;gap:12px;margin:12px 0;flex-wrap:wrap}.pill{background:#111827;border:1px solid #155e75;border-radius:9px;padding:9px 12px;font-weight:800}button{background:#67e8f9;color:#083344;border:0;border-radius:9px;padding:10px 18px;font-weight:900;cursor:pointer}.msg{min-height:24px;color:#94a3b8}
</style>
</head>
<body>
<main class="wrap">
  <h1>Reaction Dash</h1>
  <div class="hud"><div class="pill">Score: <span id="score">0</span></div><div class="pill">Time: <span id="time">30</span></div><button id="start">Start</button></div>
  <div class="arena" id="arena"></div>
  <p class="msg" id="msg">Hit green targets. Avoid red decoys.</p>
</main>
<script>
const arena=document.getElementById('arena'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),msg=document.getElementById('msg');let score=0,time=30,timer,spawnTimer,active=false;
function start(){score=0;time=30;active=true;scoreEl.textContent=score;timeEl.textContent=time;msg.textContent='Go!';arena.innerHTML='';clearInterval(timer);clearInterval(spawnTimer);timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)end();},1000);spawnTimer=setInterval(spawn,620);spawn();}
function end(){active=false;clearInterval(timer);clearInterval(spawnTimer);arena.innerHTML='';msg.textContent='Final score: '+score;}
function spawn(){if(!active)return;const d=document.createElement('button'),bad=Math.random()<.25;d.className='target'+(bad?' bad':'');d.style.left=30+Math.random()*(arena.clientWidth-60)+'px';d.style.top=30+Math.random()*(arena.clientHeight-60)+'px';d.onclick=()=>{if(bad){score=Math.max(0,score-2);msg.textContent='Decoy!'}else{score++;msg.textContent='Nice hit';}scoreEl.textContent=score;d.remove();};arena.appendChild(d);setTimeout(()=>d.remove(),900);}
document.getElementById('start').onclick=start;
</script>
</body>
</html>
