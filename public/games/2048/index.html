<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 - Play Free Online</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: Arial, sans-serif; color: #eee; }
h1 { color: #ffd700; margin-bottom: 10px; }
#score { font-size: 1.2rem; margin-bottom: 15px; }
#board { display: grid; grid-template-columns: repeat(4, 80px); grid-template-rows: repeat(4, 80px); gap: 8px; background: #16213e; padding: 10px; border-radius: 10px; }
.cell { width: 80px; height: 80px; background: #0f3460; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; color: #eee; transition: all 0.15s; }
.cell[data-value="2"] { background: #2d4057; }
.cell[data-value="4"] { background: #3d5a80; }
.cell[data-value="8"] { background: #e8a87c; color: #fff; }
.cell[data-value="16"] { background: #d8572a; color: #fff; }
.cell[data-value="32"] { background: #c73e1d; color: #fff; }
.cell[data-value="64"] { background: #b22222; color: #fff; }
.cell[data-value="128"] { background: #ffd700; color: #000; font-size: 1.3rem; }
.cell[data-value="256"] { background: #ffaa00; color: #000; font-size: 1.3rem; }
.cell[data-value="512"] { background: #ff6600; color: #fff; font-size: 1.3rem; }
.cell[data-value="1024"] { background: #ff3300; color: #fff; font-size: 1.1rem; }
.cell[data-value="2048"] { background: #00ff00; color: #000; font-size: 1.1rem; }
#game-over { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; flex-direction: column; }
#game-over h2 { color: #ff4444; font-size: 2rem; }
#restart { background: #ffd700; color: #000; border: none; padding: 12px 30px; font-size: 1rem; border-radius: 8px; cursor: pointer; margin-top: 20px; }
#restart:hover { background: #ffaa00; }
.ad-placeholder { background: #16213e; padding: 15px; margin: 15px 0; text-align: center; border-radius: 8px; color: #666; font-size: 0.8rem; }
</style>
</head>
<body>
<h1>2048</h1>
<div id="score">Score: 0</div>
<div id="board"></div>
<div id="game-over">
  <h2>Game Over!</h2>
  <p id="final-score"></p>
  <button id="restart">Play Again</button>
</div>
<div class="ad-placeholder">
  <!-- Replace with actual AdSense code -->
  <p>Advertisement</p>
</div>
<script>
const SIZE = 4;
let board, score;

function init() {
  board = Array(SIZE).fill(null).map(() => Array(SIZE).fill(0));
  score = 0;
  addTile();
  addTile();
  render();
}

function addTile() {
  const empty = [];
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (board[r][c] === 0) empty.push([r, c]);
  if (empty.length === 0) return;
  const [r, c] = empty[Math.floor(Math.random() * empty.length)];
  board[r][c] = Math.random() < 0.9 ? 2 : 4;
}

function render() {
  const el = document.getElementById('board');
  el.innerHTML = '';
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      if (board[r][c] !== 0) {
        cell.textContent = board[r][c];
        cell.dataset.value = board[r][c];
      }
      el.appendChild(cell);
    }
  }
  document.getElementById('score').textContent = `Score: ${score}`;
}

function slide(row) {
  let arr = row.filter(v => v !== 0);
  for (let i = 0; i < arr.length - 1; i++) {
    if (arr[i] === arr[i + 1]) {
      arr[i] *= 2;
      score += arr[i];
      arr[i + 1] = 0;
    }
  }
  arr = arr.filter(v => v !== 0);
  while (arr.length < SIZE) arr.push(0);
  return arr;
}

function move(dir) {
  let moved = false;
  const old = JSON.stringify(board);
  if (dir === 'left' || dir === 'right') {
    for (let r = 0; r < SIZE; r++) {
      let row = [...board[r]];
      if (dir === 'right') row.reverse();
      row = slide(row);
      if (dir === 'right') row.reverse();
      board[r] = row;
    }
  } else {
    for (let c = 0; c < SIZE; c++) {
      let col = [];
      for (let r = 0; r < SIZE; r++) col.push(board[r][c]);
      if (dir === 'down') col.reverse();
      col = slide(col);
      if (dir === 'down') col.reverse();
      for (let r = 0; r < SIZE; r++) board[r][c] = col[r];
    }
  }
  if (JSON.stringify(board) !== old) {
    addTile();
    render();
    if (isGameOver()) {
      document.getElementById('final-score').textContent = `Final Score: ${score}`;
      document.getElementById('game-over').style.display = 'flex';
    }
  }
}

function isGameOver() {
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++) {
      if (board[r][c] === 0) return false;
      if (c < SIZE - 1 && board[r][c] === board[r][c + 1]) return false;
      if (r < SIZE - 1 && board[r][c] === board[r + 1][c]) return false;
    }
  return true;
}

document.addEventListener('keydown', e => {
  const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
  if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
});

let startX, startY;
document.addEventListener('touchstart', e => { startX = e.touches[0].clientX; startY = e.touches[0].clientY; });
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - startX;
  const dy = e.changedTouches[0].clientY - startY;
  if (Math.abs(dx) > Math.abs(dy)) {
    move(dx > 0 ? 'right' : 'left');
  } else {
    move(dy > 0 ? 'down' : 'up');
  }
});

document.getElementById('restart').addEventListener('click', () => {
  document.getElementById('game-over').style.display = 'none';
  init();
});

init();
</script>
</body>
</html>
