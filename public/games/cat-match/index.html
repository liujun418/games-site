<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cat Match - Play Free Online</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #fff0f5; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Comic Sans MS', 'Chalkboard SE', Arial, sans-serif; color: #4a3535; }
h1 { color: #ff6b9d; margin-bottom: 8px; font-size: 2rem; text-shadow: 2px 2px 0 #ffe0ec; }
#info { display: flex; gap: 24px; margin-bottom: 12px; font-size: 1.2rem; font-weight: bold; }
#score { color: #ff9a3c; }
#timer { color: #4ecdc4; }
#timer.urgent { color: #ff6b6b; animation: pulse 0.5s ease-in-out infinite alternate; }
@keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }
#board { display: grid; gap: 4px; padding: 10px; background: linear-gradient(135deg, #ffe0f0, #e0f0ff); border-radius: 16px; box-shadow: 0 4px 15px rgba(255,107,157,0.3); }
.cell { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; border-radius: 12px; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; user-select: none; background: white; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
.cell:hover { transform: scale(1.1); box-shadow: 0 4px 12px rgba(255,107,157,0.4); }
.cell:active { transform: scale(0.95); }
.cell.eliminated { animation: pop 0.3s ease-out forwards; }
@keyframes pop { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.7; } 100% { transform: scale(0); opacity: 0; } }
.cell.empty { visibility: hidden; pointer-events: none; }
#overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,240,245,0.95); align-items: center; justify-content: center; flex-direction: column; }
#overlay.show { display: flex; }
#overlay h2 { color: #ff6b9d; font-size: 2.2rem; margin-bottom: 10px; text-shadow: 2px 2px 0 #ffe0ec; }
#overlay .final-score { font-size: 1.5rem; color: #ff9a3c; margin-bottom: 20px; font-weight: bold; }
.btn { background: linear-gradient(135deg, #ff6b9d, #ff8fb1); color: white; border: none; padding: 14px 36px; font-size: 1.1rem; border-radius: 30px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 12px rgba(255,107,157,0.4); transition: transform 0.15s; }
.btn:hover { transform: scale(1.05); }
.btn:active { transform: scale(0.95); }
.combo { position: fixed; pointer-events: none; font-size: 1.5rem; font-weight: bold; color: #ff9a3c; animation: floatUp 0.8s ease-out forwards; z-index: 10; text-shadow: 1px 1px 0 white; }
@keyframes floatUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-60px); opacity: 0; } }
.ad-placeholder { background: linear-gradient(135deg, #ffe0f0, #e0f0ff); padding: 12px; margin: 15px 0; text-align: center; border-radius: 12px; color: #aaa; font-size: 0.8rem; width: 320px; }
@media (max-width: 500px) { .cell { width: 48px; height: 48px; font-size: 1.8rem; } #board { gap: 3px; padding: 8px; } h1 { font-size: 1.5rem; } #info { gap: 16px; font-size: 1rem; } }
</style>
</head>
<body>
<h1>Cat Match</h1>
<div id="info">
  <span id="score">Score: 0</span>
  <span id="timer">Time: 60s</span>
</div>
<div id="board"></div>
<div id="overlay">
  <h2 id="overlay-title">Cat Match!</h2>
  <p id="overlay-desc" style="color: #888; margin-bottom: 8px; text-align: center; max-width: 280px; line-height: 1.5;">Tap adjacent matching cats to eliminate them. Clear as many as you can in 60 seconds!</p>
  <p class="final-score" id="final-score"></p>
  <button class="btn" id="overlay-btn">Start Game</button>
</div>
<div class="ad-placeholder"><p>Advertisement</p></div>
<script>
const CATS = ['🐱', '🐈', '😺', '🐾', '🎀', '🐟'];
const ROWS = 8, COLS = 8, TOTAL_TIME = 60;
let board, score, timeLeft, gameTimer, running, combo;

function init() {
  score = 0;
  timeLeft = TOTAL_TIME;
  combo = 0;
  running = false;
  updateScore();
  updateTimer();
  fillBoard();
  render();
  showOverlay('Cat Match!', 'Tap adjacent matching cats to eliminate them. Clear as many as you can in 60 seconds!', '', 'Start Game');
}

function fillBoard() {
  board = [];
  for (let r = 0; r < ROWS; r++) {
    board[r] = [];
    for (let c = 0; c < COLS; c++) {
      board[r][c] = CATS[Math.floor(Math.random() * CATS.length)];
    }
  }
}

function render() {
  const el = document.getElementById('board');
  el.style.gridTemplateColumns = `repeat(${COLS}, 60px)`;
  el.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell' + (board[r][c] === '' ? ' empty' : '');
      cell.dataset.row = r;
      cell.dataset.col = c;
      if (board[r][c] !== '') {
        cell.textContent = board[r][c];
        cell.addEventListener('click', () => handleClick(r, c, cell));
      }
      el.appendChild(cell);
    }
  }
}

function getAdjacent(r, c) {
  return [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].filter(([rr,cc]) => rr>=0 && rr<ROWS && cc>=0 && cc<COLS);
}

function floodFill(r, c, cat, visited) {
  const key = `${r},${c}`;
  if (visited.has(key) || board[r][c] !== cat) return [];
  visited.add(key);
  let result = [[r, c]];
  for (const [nr, nc] of getAdjacent(r, c)) {
    result = result.concat(floodFill(nr, nc, cat, visited));
  }
  return result;
}

function showCombo(text, r, c) {
  const el = document.getElementById('board');
  const cell = el.querySelector(`[data-row="${r}"][data-col="${c}"]`);
  if (!cell) return;
  const rect = cell.getBoundingClientRect();
  const float = document.createElement('div');
  float.className = 'combo';
  float.textContent = text;
  float.style.left = rect.left + 'px';
  float.style.top = rect.top + 'px';
  document.body.appendChild(float);
  setTimeout(() => float.remove(), 800);
}

function handleClick(r, c, cell) {
  if (!running || board[r][c] === '') return;
  const cat = board[r][c];
  const group = floodFill(r, c, cat, new Set());

  if (group.length < 2) return;

  combo++;
  const points = group.length * combo;
  score += points;
  updateScore();

  if (combo > 1) showCombo(`+${points} x${combo} Combo!`, r, c);
  else showCombo(`+${points}`, r, c);

  group.forEach(([gr, gc]) => {
    const cellEl = document.getElementById('board').querySelector(`[data-row="${gr}"][data-col="${gc}"]`);
    if (cellEl) {
      cellEl.classList.add('eliminated');
      setTimeout(() => {
        board[gr][gc] = '';
        cellEl.classList.remove('eliminated');
        cellEl.classList.add('empty');
        cellEl.textContent = '';
        cellEl.style.pointerEvents = 'none';
      }, 280);
    }
  });

  setTimeout(() => {
    applyGravity();
    fillColumns();
    render();
  }, 320);
}

function applyGravity() {
  for (let c = 0; c < COLS; c++) {
    let col = [];
    for (let r = ROWS - 1; r >= 0; r--) {
      if (board[r][c] !== '') col.push(board[r][c]);
    }
    for (let r = 0; r < ROWS; r++) {
      board[r][c] = r < col.length ? col[r] : '';
    }
  }
}

function fillColumns() {
  for (let c = 0; c < COLS; c++) {
    for (let r = 0; r < ROWS; r++) {
      if (board[r][c] === '') {
        board[r][c] = CATS[Math.floor(Math.random() * CATS.length)];
      }
    }
  }
}

function updateScore() {
  document.getElementById('score').textContent = `Score: ${score}`;
}

function updateTimer() {
  const el = document.getElementById('timer');
  el.textContent = `Time: ${timeLeft}s`;
  el.classList.toggle('urgent', timeLeft <= 10);
}

function startGame() {
  if (running) return;
  running = true;
  combo = 0;
  hideOverlay();
  gameTimer = setInterval(() => {
    timeLeft--;
    updateTimer();
    if (timeLeft <= 0) {
      clearInterval(gameTimer);
      running = false;
      showOverlay('Time\'s Up!', 'Great job! Here are your results:', `Final Score: ${score}`, 'Play Again');
    }
  }, 1000);
}

function showOverlay(title, desc, finalScore, btnText) {
  document.getElementById('overlay-title').textContent = title;
  document.getElementById('overlay-desc').textContent = desc;
  document.getElementById('final-score').textContent = finalScore;
  document.getElementById('overlay-btn').textContent = btnText;
  document.getElementById('overlay').classList.add('show');
}

function hideOverlay() {
  document.getElementById('overlay').classList.remove('show');
}

document.getElementById('overlay-btn').addEventListener('click', () => {
  init();
  startGame();
});

init();
</script>
</body>
</html>
