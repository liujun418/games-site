<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match - Play Free Online</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: Arial, sans-serif; color: #eee; }
h1 { color: #a855f7; margin-bottom: 10px; }
#info { display: flex; gap: 30px; margin-bottom: 15px; }
#moves, #pairs { font-size: 1rem; }
#board { display: grid; grid-template-columns: repeat(4, 80px); gap: 10px; }
.card { width: 80px; height: 80px; perspective: 600px; cursor: pointer; }
.card-inner { width: 100%; height: 100%; position: relative; transition: transform 0.5s; transform-style: preserve-3d; }
.card.flipped .card-inner { transform: rotateY(180deg); }
.card.matched { visibility: hidden; }
.card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
.card-front { background: #16213e; border: 2px solid #a855f7; color: #a855f7; font-size: 1.5rem; }
.card-back { background: #3b1f6e; border: 2px solid #a855f7; transform: rotateY(180deg); }
#win { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; flex-direction: column; }
#win h2 { color: #a855f7; font-size: 2rem; }
#restart { background: #a855f7; color: #fff; border: none; padding: 12px 30px; font-size: 1rem; border-radius: 8px; cursor: pointer; margin-top: 20px; }
#restart:hover { background: #7c3aed; }
.ad-placeholder { background: #16213e; padding: 15px; margin: 15px 0; text-align: center; border-radius: 8px; color: #666; font-size: 0.8rem; }
@media (max-width: 500px) { #board { grid-template-columns: repeat(4, 65px); gap: 8px; } .card { width: 65px; height: 65px; } }
</style>
</head>
<body>
<h1>Memory Match</h1>
<div id="info">
  <span id="moves">Moves: 0</span>
  <span id="pairs">Pairs: 0/8</span>
</div>
<div id="board"></div>
<div id="win">
  <h2>You Win!</h2>
  <p id="final-moves"></p>
  <button id="restart">Play Again</button>
</div>
<div class="ad-placeholder"><p>Advertisement</p></div>
<script>
const emojis = ['🎮', '🎲', '🎯', '🎪', '🎨', '🎭', '🎵', '🎸'];
let cards, flipped, matched, moves, lock;

function init() {
  document.getElementById('win').style.display = 'none';
  const pairs = [...emojis, ...emojis];
  cards = pairs.sort(() => Math.random() - 0.5);
  flipped = [];
  matched = 0;
  moves = 0;
  lock = false;
  updateInfo();
  render();
}

function render() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  cards.forEach((emoji, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<div class="card-inner"><div class="card-front">?</div><div class="card-back">${emoji}</div></div>`;
    card.addEventListener('click', () => flip(i, card));
    board.appendChild(card);
  });
}

function flip(index, cardEl) {
  if (lock || cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;

  cardEl.classList.add('flipped');
  flipped.push({ index, el: cardEl, emoji: cards[index] });

  if (flipped.length === 2) {
    moves++;
    updateInfo();
    lock = true;

    if (flipped[0].emoji === flipped[1].emoji) {
      setTimeout(() => {
        flipped[0].el.classList.add('matched');
        flipped[1].el.classList.add('matched');
        matched++;
        updateInfo();
        flipped = [];
        lock = false;
        if (matched === emojis.length) {
          document.getElementById('final-moves').textContent = `Completed in ${moves} moves!`;
          document.getElementById('win').style.display = 'flex';
        }
      }, 500);
    } else {
      setTimeout(() => {
        flipped[0].el.classList.remove('flipped');
        flipped[1].el.classList.remove('flipped');
        flipped = [];
        lock = false;
      }, 1000);
    }
  }
}

function updateInfo() {
  document.getElementById('moves').textContent = `Moves: ${moves}`;
  document.getElementById('pairs').textContent = `Pairs: ${matched}/${emojis.length}`;
}

document.getElementById('restart').addEventListener('click', init);

init();
</script>
</body>
</html>
