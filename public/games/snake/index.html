<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game - Play Free Online</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: Arial, sans-serif; color: #eee; }
h1 { color: #00ff88; margin-bottom: 10px; }
#score { font-size: 1.2rem; margin-bottom: 10px; }
canvas { background: #0d1117; border: 2px solid #00ff88; border-radius: 8px; }
#game-over { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; flex-direction: column; }
#game-over h2 { color: #ff4444; font-size: 2rem; }
#restart { background: #00ff88; color: #000; border: none; padding: 12px 30px; font-size: 1rem; border-radius: 8px; cursor: pointer; margin-top: 20px; }
#restart:hover { background: #00cc66; }
.ad-placeholder { background: #16213e; padding: 15px; margin: 15px 0; text-align: center; border-radius: 8px; color: #666; font-size: 0.8rem; }
#controls { display: none; margin-top: 15px; }
@media (max-width: 768px) { #controls { display: grid; grid-template-columns: repeat(3, 60px); gap: 5px; justify-content: center; } }
.ctrl { width: 60px; height: 60px; background: #16213e; border: 1px solid #00ff88; border-radius: 8px; color: #fff; font-size: 1.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.ctrl:active { background: #00ff88; color: #000; }
</style>
</head>
<body>
<h1>Snake</h1>
<div id="score">Score: 0</div>
<canvas id="game" width="400" height="400"></canvas>
<div id="controls">
  <div></div>
  <button class="ctrl" data-dir="up">▲</button>
  <div></div>
  <button class="ctrl" data-dir="left">◀</button>
  <button class="ctrl" data-dir="down">▼</button>
  <button class="ctrl" data-dir="right">▶</button>
</div>
<div id="game-over">
  <h2>Game Over!</h2>
  <p id="final-score"></p>
  <button id="restart">Play Again</button>
</div>
<div class="ad-placeholder"><p>Advertisement</p></div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const GRID = 20;
const CELL = canvas.width / GRID;

let snake, food, dir, nextDir, score, speed, gameLoop;

function init() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = { x: 1, y: 0 };
  nextDir = { ...dir };
  score = 0;
  speed = 150;
  placeFood();
  updateScore();
  if (gameLoop) clearInterval(gameLoop);
  gameLoop = setInterval(update, speed);
}

function placeFood() {
  let pos;
  do {
    pos = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
  } while (snake.some(s => s.x === pos.x && s.y === pos.y));
  food = pos;
}

function update() {
  dir = { ...nextDir };
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID || snake.some(s => s.x === head.x && s.y === head.y)) {
    clearInterval(gameLoop);
    document.getElementById('final-score').textContent = `Final Score: ${score}`;
    document.getElementById('game-over').style.display = 'flex';
    return;
  }

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    updateScore();
    placeFood();
  } else {
    snake.pop();
  }

  draw();
}

function draw() {
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Snake
  snake.forEach((seg, i) => {
    ctx.fillStyle = i === 0 ? '#00ff88' : '#00cc66';
    ctx.fillRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2);
    ctx.strokeStyle = '#0d1117';
    ctx.strokeRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2);
  });

  // Food
  ctx.fillStyle = '#ff4444';
  ctx.beginPath();
  ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
  ctx.fill();
}

function updateScore() {
  document.getElementById('score').textContent = `Score: ${score}`;
}

function setDirection(d) {
  const dirs = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };
  const nd = dirs[d];
  if (nd && !(nd.x === -dir.x && nd.y === -dir.y)) nextDir = nd;
}

document.addEventListener('keydown', e => {
  const map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
  if (map[e.key]) { e.preventDefault(); setDirection(map[e.key]); }
});

document.querySelectorAll('.ctrl').forEach(btn => {
  btn.addEventListener('click', () => setDirection(btn.dataset.dir));
});

document.getElementById('restart').addEventListener('click', () => {
  document.getElementById('game-over').style.display = 'none';
  init();
});

init();
</script>
</body>
</html>
