<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whack-a-Mole - Play Free Online</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: Arial, sans-serif; color: #eee; }
h1 { color: #4ecdc4; margin-bottom: 10px; }
#info { display: flex; gap: 30px; font-size: 1.2rem; margin-bottom: 15px; }
#score { color: #ffd700; }
#timer { color: #ff6b9d; }
#board { display: grid; grid-template-columns: repeat(3, 110px); gap: 12px; }
.hole { width: 110px; height: 110px; background: #16213e; border: 3px solid #333; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3rem; cursor: pointer; user-select: none; }
.hole:hover { border-color: #ffd700; }
.hole.active { background: #2ecc71; border-color: #27ae60; animation: popUp 0.15s ease-out; }
.hole.hit { background: #e74c3c; border-color: #c0392b; animation: hit 0.2s ease-out; }
@keyframes popUp { from { transform: scale(0.8); } to { transform: scale(1); } }
@keyframes hit { from { transform: scale(1); } to { transform: scale(0.9); } }
#start-screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; flex-direction: column; }
#start-screen h2 { color: #4ecdc4; font-size: 2rem; margin-bottom: 10px; }
#start-screen p { color: #aaa; margin-bottom: 20px; text-align: center; line-height: 1.6; }
#start-btn { background: #4ecdc4; color: #000; border: none; padding: 12px 30px; font-size: 1rem; border-radius: 8px; cursor: pointer; }
#start-btn:hover { background: #3ab5a5; }
#game-over { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; flex-direction: column; }
#game-over h2 { color: #ffd700; font-size: 2rem; }
#restart { background: #4ecdc4; color: #000; border: none; padding: 12px 30px; font-size: 1rem; border-radius: 8px; cursor: pointer; margin-top: 20px; }
.ad-placeholder { background: #16213e; padding: 15px; margin: 15px 0; text-align: center; border-radius: 8px; color: #666; font-size: 0.8rem; }
</style>
</head>
<body>
<h1>Whack-a-Mole</h1>
<div id="info">
  <span id="score">Score: 0</span>
  <span id="timer">Time: 30s</span>
</div>
<div id="board"></div>
<div id="start-screen">
  <h2>Whack-a-Mole!</h2>
  <p>Tap the moles as fast as you can!<br/>You have 30 seconds.</p>
  <button id="start-btn">Start Game</button>
</div>
<div id="game-over">
  <h2>Game Over!</h2>
  <p id="final-score" style="color:#ffd700;font-size:1.2rem;margin-bottom:16px;"></p>
  <button id="restart">Play Again</button>
</div>
<div class="ad-placeholder"><p>Advertisement</p></div>
<script>
var HOLES = 9, TIME = 30, MOLE_SPEED = 800;
var score, timeLeft, timer, moleTimer, running;

function init() {
  score = 0;
  timeLeft = TIME;
  running = false;
  updateUI();
  renderBoard();
  document.getElementById('start-screen').style.display = 'flex';
  document.getElementById('game-over').style.display = 'none';
}

function renderBoard() {
  var el = document.getElementById('board');
  el.innerHTML = '';
  for (var i = 0; i < HOLES; i++) {
    var hole = document.createElement('div');
    hole.className = 'hole';
    hole.textContent = '🕳️';
    hole.dataset.idx = i;
    hole.addEventListener('click', whack);
    el.appendChild(hole);
  }
}

function startGame() {
  if (running) return;
  running = true;
  document.getElementById('start-screen').style.display = 'none';
  timer = setInterval(function() {
    timeLeft--;
    updateUI();
    if (timeLeft <= 0) {
      clearInterval(timer);
      clearInterval(moleTimer);
      running = false;
      document.getElementById('final-score').textContent = 'Final Score: ' + score;
      document.getElementById('game-over').style.display = 'flex';
    }
  }, 1000);
  showMole();
}

function showMole() {
  if (!running) return;
  clearMoles();
  var idx = Math.floor(Math.random() * HOLES);
  var hole = document.querySelectorAll('.hole')[idx];
  hole.textContent = '🐹';
  hole.classList.add('active');
  var delay = Math.max(400, MOLE_SPEED - score * 5);
  moleTimer = setTimeout(showMole, delay);
}

function clearMoles() {
  var holes = document.querySelectorAll('.hole');
  for (var i = 0; i < holes.length; i++) {
    holes[i].classList.remove('active', 'hit');
    holes[i].textContent = '🕳️';
  }
}

function whack(e) {
  if (!running) return;
  var hole = e.target;
  if (!hole.classList.contains('active')) return;
  score++;
  updateUI();
  hole.textContent = '💥';
  hole.classList.remove('active');
  hole.classList.add('hit');
  setTimeout(function() {
    hole.textContent = '🕳️';
    hole.classList.remove('hit');
  }, 200);
}

function updateUI() {
  document.getElementById('score').textContent = 'Score: ' + score;
  document.getElementById('timer').textContent = 'Time: ' + timeLeft + 's';
}

document.getElementById('start-btn').addEventListener('click', function(e) { e.stopPropagation(); startGame(); });
document.getElementById('restart').addEventListener('click', function(e) { e.stopPropagation(); init(); startGame(); });

init();
</script>
</body>
</html>
